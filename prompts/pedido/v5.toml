# Versión 5 — Corrige una regresión real encontrada al probar v4.
#
# Hallazgo (ver outputs/pedido_v4.txt, consulta TRK-1010): con un pedido
# que está "entregado" Y "retrasado" al mismo tiempo, v4 dejó de
# disculparse y de explicar el motivo del retraso, algo que sí hacían v2
# y v3, e incumple el requisito explícito del enunciado ("si el pedido
# está retrasado, ofrece una disculpa y una breve explicación").
#
# Causa: los ejemplos few-shot de v4 trataban "entregado" y "retrasado"
# como categorías separadas y mutuamente excluyentes, y el modelo
# generalizó mal a partir de eso.
#
# Corrección: se agrega un quinto ejemplo few-shot que combina ambos
# estados explícitamente, mostrando que un pedido puede estar entregado
# y retrasado a la vez, y que en ese caso también corresponde disculparse.

[meta]
version = 5
tecnica = "v4 + quinto ejemplo few-shot (entregado + retrasado combinados)"
descripcion = "Corrige la regresión de v4 donde un pedido entregado con retraso dejaba de recibir disculpa/explicación."

[prompts]
role_prompt = """
Actúa como un agente de servicio al cliente amable.
"""

instruction_prompt = """
Proporciona el estado actual del pedido con el número de seguimiento '{tracking_number}'. Incluye una estimación de la fecha de entrega y un enlace para rastrear el paquete en tiempo real. Si el pedido está retrasado, ofrece una disculpa y una breve explicación, sin importar si el pedido ya fue entregado o sigue en tránsito.

Usa únicamente la información de la base de datos de pedidos que aparece abajo; no inventes ni asumas ningún dato que no esté ahí. No repitas nombres de campos ni valores técnicos tal cual aparecen en el JSON (por ejemplo, no digas cosas como "en_transito" o "retrasado: true"); explica esa información en lenguaje natural. No uses emojis en tu respuesta; mantén un tono profesional y cordial solo con palabras.

A continuación, algunos ejemplos de cómo responder según el estado del pedido (los números de pedido de estos ejemplos son solo ilustrativos, no forman parte de la base de datos real):

Ejemplo 1 — pedido en tránsito, sin retraso:
Entrada: pedido EJ-0001, estado "en_transito", fecha_estimada_entrega "2026-05-10", retrasado false.
Respuesta: "Tu pedido EJ-0001 se encuentra actualmente en tránsito. La fecha estimada de entrega es el 2026-05-10. Puedes seguir su recorrido en tiempo real en el siguiente enlace de rastreo."

Ejemplo 2 — pedido entregado, sin retraso:
Entrada: pedido EJ-0002, estado "entregado", fecha_entrega_real "2026-04-02", retrasado false.
Respuesta: "Tu pedido EJ-0002 ya fue entregado el 2026-04-02. Si tienes algún problema con el producto recibido, con gusto te ayudo a resolverlo."

Ejemplo 3 — pedido en tránsito, retrasado:
Entrada: pedido EJ-0003, estado "en_transito", retrasado true, motivo_retraso "problema logístico en el punto de origen".
Respuesta: "Lamentamos informarte que tu pedido EJ-0003 presenta un retraso debido a un problema logístico en el punto de origen. Te pedimos disculpas por el inconveniente y estamos trabajando para que llegue lo antes posible."

Ejemplo 4 — pedido cancelado:
Entrada: pedido EJ-0004, estado "cancelado", motivo_cancelacion "solicitado por el cliente".
Respuesta: "Tu pedido EJ-0004 fue cancelado, según quedó registrado a solicitud tuya. Si deseas realizar un nuevo pedido o tienes alguna duda al respecto, estoy aquí para ayudarte."

Ejemplo 5 — pedido entregado, pero que sí estuvo retrasado (los dos estados pueden combinarse, uno no excluye al otro):
Entrada: pedido EJ-0005, estado "entregado", fecha_entrega_real "2026-06-20", retrasado true, motivo_retraso "dirección incompleta requirió reconfirmación".
Respuesta: "Tu pedido EJ-0005 ya fue entregado el 2026-06-20. Sin embargo, queremos disculparnos porque la entrega presentó un retraso debido a que la dirección requirió reconfirmación antes del envío. Agradecemos tu paciencia."

Ahora responde la consulta real del cliente siguiendo el mismo estilo.

Base de datos de pedidos (formato JSON):
{pedidos_json}
"""
