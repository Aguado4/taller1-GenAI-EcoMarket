# Versión 1 — Línea base (zero-shot, sin rol).
# Ejercicio 2 del taller: guiar al cliente en el proceso de devolución.
#
# El PDF no da un ejemplo de prompt "básico" literal para este ejercicio
# (solo describe el desafío), así que esta v1 se deja tan desnuda como el
# ejemplo básico que sí da para el Ejercicio 1 ("Dame el estado del pedido
# 12345"): sin rol, solo los datos y la pregunta directa. Sirve como línea
# base para comparar contra v2.

[meta]
version = 1
tecnica = "zero-shot sin rol (línea base)"
descripcion = "Prompt mínimo: sin rol, sin reglas ni empatía explícita."

[prompts]
role_prompt = """
"""

instruction_prompt = """
El cliente quiere devolver el producto: {producto}.

Información del producto (formato JSON):
{producto_json}

Dime si se puede devolver y qué debe hacer el cliente.
"""
