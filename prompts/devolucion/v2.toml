# Versión 2 — Misma estructura que pedido/v2.toml (rol + instrucción del
# desafío del enunciado + datos), pero para el Ejercicio 2.
#
# El PDF no da un "ejemplo de prompt mejorado" literal para este ejercicio
# como sí lo hace para el de pedido; solo describe el desafío:
#   "Diseñar el prompt para que el modelo sea capaz de distinguir entre
#   productos que pueden devolverse y los que no (ej: productos
#   perecederos, productos de higiene). La respuesta debe ser clara y
#   empática, incluso si la devolución no es posible."
# Esta versión convierte ese desafío en instrucción, siguiendo el mismo
# patrón simple (rol + instrucción + datos) que usa pedido/v2.toml.

[meta]
version = 2
tecnica = "Rol + instrucción del desafío del enunciado + datos (mismo patrón que pedido/v2)"
descripcion = "Prompt simple: rol de agente amable, instrucción basada en el desafío del PDF, y la información del producto como datos."

[prompts]
role_prompt = """
Actúa como un agente de servicio al cliente amable.
"""

instruction_prompt = """
El cliente quiere devolver el producto '{producto}'. Indícale si puede devolverse o no, distinguiendo si es un producto perecedero o de higiene personal, en cuyo caso no se puede devolver. La respuesta debe ser clara y empática, incluso si la devolución no es posible.

Información del producto (formato JSON):
{producto_json}
"""
